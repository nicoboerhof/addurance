<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hoff Creative Productions</title>
  <script>
    const lang = navigator.language || navigator.userLanguage;
    if (lang.startsWith('nl')) {
      window.location.replace('/addurance/nl/');
    } else {
      window.location.replace('/addurance/en/');
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/addurance/en/">
  </noscript>
</head>
<body>
  <p>Redirecting... <a href="/addurance/en/">English</a> | <a href="/addurance/nl/">Nederlands</a></p>
</body>
</html>
